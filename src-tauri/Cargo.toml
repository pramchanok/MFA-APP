[package]
name = "mfa-desktop"
version = "0.5.3"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mfa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iota_stronghold = "2.1"
argon2 = "0.5"
rand = "0.8"
data-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
objc2 = "0.6.5"
core-foundation = "0.10.1"

# Stronghold recommends optimizing scrypt even for usable development builds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
